<!-- FONT AWESOME -->
<link 
  rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<!-- Custom CSS -->
<style>
  body {
  background: linear-gradient(135deg, #e1e9f4ff, #e4eef4ff);
  font-family: 'Poppins', sans-serif;
}
  .gradient-heading {
    box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
  color: #ff4d6d;
  transition: all 0.3s ease-in-out;
}

.gradient-heading:hover {
  box-shadow: 0 12px 25px rgba(255, 77, 109, 0.5);
  transform: translateY(-3px);
  background: linear-gradient(135deg, #ffe0e6, #fff0f3);
}

  .icon-buttons {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
  }

  .icon-buttons .btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .cart {
    background-color: #007bff;
    color: white;
  }

  .heart {
    border: 1px solid red;
    color: red;
    background: none;
  }

  .share {
    border: 1px solid gray;
    background: none;
    color: gray;
  }

  .price {
    font-size: 16px;
    font-weight: bold;
    color: #28a745;
    margin: 5px 0;
  }
 .card {
    transition: 0.3s ease;
  }

  .card-text {
    background-color: #ff4d6d;
    color: white;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    display: inline-block;
  }
   .card:hover {
    transform: scale(1.03);
  }
</style>
